<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>
    <h1>Contact</h1>


    <form action="mailto:lzubiate@ucsd.edu" method="POST" enctype="text/plain">
        <label>
            Email:
            <input name="email" type="email" placeholder="example@email.com">
        </label>

        <label>
            Subject:
            <input name="subject" placeholder="Enter a subject">
        </label>

        <label>
            Message:
            <textarea name="body" rows="5" placeholder="Enter your message"></textarea>
        </label>

        <button type="submit">Send</button>
    </form>
</body>
</html>
